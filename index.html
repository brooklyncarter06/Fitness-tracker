
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Fitness Tracker</h1>
            <p>Track your workouts and daily progress</p>
        </header>

        <section class="dashboard">
            <div class="stat">
                <h3>Total Workouts</h3>
                <p id="totalWorkouts">0</p>
            </div>

            <div class="stat">
                <h3>Minutes Exercised</h3>
                <p id="totalMinutes">0</p>
            </div>

            <div class="stat">
                <h3>Calories Burned</h3>
                <p id="totalCalories">0</p>
            </div>
        </section>

        <section class="card">
            <h2>Add Workout</h2>

            <form id="workoutForm">
                <label for="exercise">Exercise</label>
                <select id="exercise" required>
                    <option value="Running">Running</option>
                    <option value="Walking">Walking</option>
                    <option value="Cycling">Cycling</option>
                    <option value="Swimming">Swimming</option>
                    <option value="Weightlifting">Weightlifting</option>
                    <option value="Yoga">Yoga</option>
                    <option value="Other">Other</option>
                </select>

                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" min="1" required>

                <label for="calories">Calories Burned</label>
                <input type="number" id="calories" min="0" required>

                <button type="submit">Add Workout</button>
            </form>
        </section>

        <section class="card">
            <h2>Daily Health Tracker</h2>

            <label for="steps">Steps Today</label>
            <input type="number" id="steps" min="0">

            <label for="water">Water Intake (glasses)</label>
            <input type="number" id="water" min="0">

            <label for="weight">Weight (lbs)</label>
            <input type="number" id="weight" min="0" step="0.1">

            <button id="saveHealth" type="button">
                Save Daily Progress
            </button>
            <p id="saveMessage" role="status"></p>
        </section>

        <section class="card">
            <h2>Workout History</h2>
            <ul id="workoutList"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
